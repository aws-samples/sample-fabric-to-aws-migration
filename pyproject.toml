[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-fabric-to-aws-migration"
version = "0.1.0"
description = "Read-only Microsoft Fabric warehouse migration assessment CLI: profiles a Fabric Warehouse and assesses migrating it to an AWS lakehouse (S3 Tables / Apache Iceberg storage, Amazon Redshift Serverless or Amazon Athena query engine)."
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # Fabric SQL analytics endpoint speaks TDS (SQL Server wire protocol).
    # pyodbc needs ODBC Driver 18; azure-identity provides Entra token auth.
    "pyodbc>=5.0",
    "azure-identity>=1.15",
    # SQL dialect translation (T-SQL -> Redshift / Athena). Same lib the
    # reference tool uses; it has a tsql source dialect.
    "sqlglot>=25.0,<31",
]

[project.scripts]
fabric-assess = "fabric_assess.cli:main"
fabric-collect = "fabric_assess.collect_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.82",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# HTML report templates ship as data files (see reference: without this the
# wheel renders JSON fine but dies on TemplateNotFound).
"fabric_assess.report" = ["templates/*.j2"]
fabric_assess = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
